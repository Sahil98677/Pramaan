
name: Pramaan CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pramaan
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=pramaan --cov-report=term-missing

      - name: Check code style
        run: ruff check .

      - name: Check types
        run: mypy src
