[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pramaan-security"
version = "0.1.0"
description = "Evidence-first, deterministic local security analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pramaan Contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
pramaan = "pramaan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pramaan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
